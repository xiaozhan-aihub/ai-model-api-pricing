name: Sync model catalogue

# Once a day: copy https://model.dflop.top/data/models.{json,csv} into data/, re-render the
# pages (README.md, pricing/, vendors/) with scripts/render.py, commit only when something
# changed, then mirror data/ and the dataset card to the Hugging Face dataset
# xiaozhan-aihub/ai-model-api-pricing when the HF_TOKEN secret is set.
# Also runs when scripts/ or this file change, and by hand from the Actions tab.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/sync.yml"

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Download
        run: |
          set -euo pipefail
          ua="xiaozhan-aihub-models-sync (+https://github.com/${GITHUB_REPOSITORY})"
          for f in models.json models.csv; do
            curl -fsSL --retry 3 --retry-delay 15 --max-time 60 -A "$ua" -o "/tmp/$f" "https://model.dflop.top/data/$f"
          done
          python3 scripts/check.py /tmp/models.json /tmp/models.csv
          mkdir -p data
          mv /tmp/models.json /tmp/models.csv data/
          # Descriptions and image / video parameters for the pages. Optional: without it the
          # data still syncs and the pages wait for the next run.
          curl -fsSL --retry 3 --retry-delay 15 --max-time 60 -A "$ua" -o /tmp/catalog.json \
            "https://api.dflop.top/api/v1/models/public" || rm -f /tmp/catalog.json

      - name: Render pages
        run: |
          set -euo pipefail
          if [ -s /tmp/catalog.json ]; then
            python3 scripts/render.py --catalog /tmp/catalog.json
          else
            echo "::warning::model catalogue unavailable: pages not re-rendered"
          fi

      - name: Commit if changed
        run: |
          set -euo pipefail
          git add data README.md
          [ -d pricing ] && git add pricing
          [ -d vendors ] && git add vendors
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: model catalogue $(date -u +%Y-%m-%d)"
          git push

      - name: Mirror to Hugging Face
        if: env.HF_TOKEN != ''
        run: |
          set -euo pipefail
          python3 -m pip install --quiet "huggingface_hub>=0.25"
          python3 scripts/push_hf.py
